title: Mimikatz-Style Credential Dumping Command Line
id: 29df6350-099e-471c-87cd-2727e8ffbb48
status: test
description: |
    Detects process command lines containing module/function names distinctive
    to Mimikatz and its ports (e.g. Rubeus for Kerberos abuse). Mimikatz's
    modules cover several credential-access techniques at once: `sekurlsa::`
    dumps LSASS memory, `lsadump::dcsync` performs a DCSync replication pull,
    and `sekurlsa::pth` executes pass-the-hash -- so a single command-line
    match here can correspond to any of them.
references:
    - https://attack.mitre.org/software/S0002/
    - https://github.com/SigmaHQ/sigma/blob/master/rules/windows/process_creation/proc_creation_win_hktl_mimikatz_command_line.yml
author: Detection Engineering KB (sample rule)
date: 2026-07-27
tags:
    - attack.credential-access
    - attack.t1003.001
    - attack.t1003.006
    - attack.t1550.002
logsource:
    category: process_creation
    product: windows
detection:
    selection_tool_name:
        CommandLine|contains:
            - 'mimikatz'
            - 'DumpCreds'
    selection_module_names:
        CommandLine|contains:
            - 'sekurlsa::'
            - 'lsadump::'
            - 'kerberos::'
            - 'privilege::debug'
    condition: 1 of selection_*
falsepositives:
    - Authorized red-team or purple-team exercises
    - Security-tooling regression tests that intentionally invoke these strings
level: critical
