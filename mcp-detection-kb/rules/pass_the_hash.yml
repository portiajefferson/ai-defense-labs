title: Potential Pass-the-Hash Activity via Anomalous NTLM Network Logon
id: 0ccf945a-f0f2-4002-8639-c27da72b7a6f
status: experimental
description: |
    Detects a Network logon (Type 3) using NTLM authentication where the key
    length is 0 -- a pattern commonly produced by pass-the-hash tooling (e.g.
    Mimikatz's `sekurlsa::pth`, Impacket's `wmiexec`/`psexec` with `-hashes`)
    that authenticates by replaying a captured NTLM hash directly, rather than
    through an interactive logon that negotiates a full session key.
references:
    - https://attack.mitre.org/techniques/T1550/002/
    - https://www.blumira.com/blog/pass-the-hash
author: Detection Engineering KB (sample rule)
date: 2026-07-27
tags:
    - attack.lateral-movement
    - attack.defense-evasion
    - attack.t1550.002
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4624
        LogonType: 3
        AuthenticationPackageName: 'NTLM'
        KeyLength: 0
    filter_anonymous:
        TargetUserName: 'ANONYMOUS LOGON'
    condition: selection and not filter_anonymous
falsepositives:
    - Legacy applications and older NTLMv1/NTLMv2 clients that don't negotiate a session key
    - Some load balancers, backup agents, and service accounts using NTLM by design
level: medium
